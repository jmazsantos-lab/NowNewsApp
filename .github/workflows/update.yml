name: Actualizar noticias

# Lee las fuentes de topics.json, agrupa las noticias y publica la app en
# GitHub Pages. Se ejecuta:
#   • cada hora, a las :07. GitHub a veces retrasa o se salta las ejecuciones
#     programadas; por eso hay un respaldo a las :37 que solo actualiza si los
#     datos publicados tienen más de 50 minutos (si no, termina en segundos),
#   • al pulsar ↻ o deslizar hacia abajo en la app (vía la función de Supabase),
#   • cuando cambia topics.json o now_config.json (temas o pesos desde la app),
#   • a mano desde la pestaña Actions («Run workflow»).
#
# Requisito: Settings → Pages → Source = «GitHub Actions».
# Variable opcional: Settings → Secrets and variables → Actions → Variables →
#   NOW_API_URL = URL de tu función de Supabase (rellena los ajustes de la app).
# Las variables NOW_PUSH_KEYS y NOW_PUSH_SUBS (notificaciones) las crea sola la
# función de Supabase cuando activas las notificaciones desde la app.

on:
  schedule:
    - cron: '7 * * * *'    # cada hora
    - cron: '37 * * * *'   # respaldo: solo actúa si la de las :07 no llegó a ejecutarse
  push:
    branches: [main]
    paths: ['topics.json', 'now_config.json', 'build.py', 'site/**']
  workflow_dispatch:
    inputs:
      push_test:
        description: 'Enviar una notificación de prueba a los dispositivos suscritos'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: now-pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
      - id: pages
        uses: actions/configure-pages@v5
      - id: age
        env:
          EVENT: ${{ github.event_name }}
          SITE: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          upd=$(curl -fsSL "$SITE/data/latest.json?t=$(date +%s)" | python3 -c 'import sys, json; print(int(json.load(sys.stdin)["updated"]))' 2>/dev/null || echo 0)
          age=$(( $(date +%s) - upd ))
          if [ "$age" -lt 3000 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Los datos son de hace $((age / 60)) min: no hace falta actualizar."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Construir las noticias
        env:
          NOW_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NOW_API_URL: ${{ vars.NOW_API_URL }}
          NOW_PUSH_KEYS: ${{ vars.NOW_PUSH_KEYS }}
          NOW_PUSH_SUBS: ${{ vars.NOW_PUSH_SUBS }}
          NOW_PUSH_TEST: ${{ inputs.push_test && '1' || '' }}
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
