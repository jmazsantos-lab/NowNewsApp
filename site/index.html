<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17232d">
<meta name="description" content="Las noticias más importantes de tus temas, por periodo.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Now">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650;7..72,750&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>:root{padding-bottom:env(safe-area-inset-bottom,0px)}html{background:var(--paper,#f6f2e9)}body{margin:0}img{max-width:100%}</style>
<style>
/* Layout: app de noticias visual, móvil primero. Burbujas de secciones, noticia principal a sangre y rejilla de tarjetas-póster con medidor de importancia. Cada sección tiene su color (paleta del email del News Digest). */
:root{
  --paper:#f6f2e9; --panel:#fffdf8; --ink:#17232d; --ink-2:#465560; --muted:#857b68;
  --hair:#e3dac7; --amber:#a5670f; --amber-tint:#f5e8cf; --hop:#3c6f38;
  --bar-bg:#ece4d3; --scrim:rgba(23,35,45,.55);
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14191d; --panel:#1b2228; --ink:#eee7d9; --ink-2:#b8b0a1; --muted:#8d8574;
  --hair:#2c353c; --amber:#e3a74a; --amber-tint:#3a2e1b; --hop:#8cc184;
  --bar-bg:#262e35; --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14191d; --panel:#1b2228; --ink:#eee7d9; --ink-2:#b8b0a1; --muted:#8d8574;
  --hair:#2c353c; --amber:#e3a74a; --amber-tint:#3a2e1b; --hop:#8cc184;
  --bar-bg:#262e35; --scrim:rgba(0,0,0,.65); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
a{color:inherit}

/* ---------- Logo: radar de noticias ---------- */
.logo .bg{fill:#17232d;stroke:rgba(240,182,79,.45);stroke-width:1.5}
.logo .grid{fill:none;stroke:rgba(255,255,255,.14);stroke-width:1.2}
.logo .blip{fill:#f0b64f}
.logo .sweep{transform-origin:32px 32px}
.top .logo .sweep{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.splash{position:fixed;inset:0;z-index:50;background:#0e161c;display:grid;place-items:center;animation:spOut .44s ease 1.56s forwards}
.splash .mk{display:flex;align-items:center;gap:16px}
.splash .logo{width:96px;height:96px;overflow:visible;animation:mkIn .9s cubic-bezier(.2,1.5,.4,1) both}
.splash .sweep{animation:sweep 1.6s cubic-bezier(.4,0,.2,1) both}
.splash .blip{transform-box:fill-box;transform-origin:center;animation:blip .6s cubic-bezier(.3,1.8,.5,1) both}
.splash .b1{animation-delay:.44s}.splash .b2{animation-delay:.76s}.splash .b3{animation-delay:1.04s}
.splash .wave{fill:none;stroke:#f0b64f;stroke-width:2;transform-origin:32px 32px;animation:wave 1.4s ease-out .3s both}
.splash .wm{display:flex;font:750 64px/1 var(--f-display);letter-spacing:-.03em;color:#f6f2e9}
.splash .wm span{display:inline-block;animation:letter .8s cubic-bezier(.2,1.4,.4,1) both}
.splash .wm span:nth-child(1){animation-delay:.5s}.splash .wm span:nth-child(2){animation-delay:.66s}.splash .wm span:nth-child(3){animation-delay:.82s}
.splash .wm span:nth-child(4){color:#f0b64f;animation-delay:1s}
@keyframes mkIn{from{transform:scale(.3) rotate(-90deg);opacity:0}}
@keyframes sweep{from{transform:rotate(-200deg)}to{transform:rotate(160deg)}}
@keyframes blip{from{transform:scale(0)}}
@keyframes wave{from{transform:scale(.3);opacity:1}to{transform:scale(1.9);opacity:0}}
@keyframes letter{from{transform:translateY(24px);opacity:0}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.splash{display:none}.top .logo .sweep{animation:none}}

/* ---------- Cabecera ---------- */
/* La cabecera se pega al borde real de la pantalla y ocupa la zona segura (muesca / barra de estado): así no se ven noticias por encima */
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--hair);padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px 8px}
.brand{display:flex;align-items:center;gap:8px;font:750 26px/1 var(--f-display);letter-spacing:-.02em}
.brand .logo{width:32px;height:32px;flex:none}
.brand i{font-style:normal;color:var(--amber)}
.seg{margin-left:auto;display:inline-flex;background:var(--bar-bg);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 9px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.range{display:flex;gap:6px;align-items:center;font-size:13px;flex-wrap:wrap;padding-bottom:8px}
.range label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.range input{background:var(--panel);border:1px solid var(--hair);border-radius:7px;padding:4px 6px;font-size:13px}

/* Burbujas de secciones */
.bubbles{display:flex;gap:12px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
.bubbles::-webkit-scrollbar{display:none}
.bub{flex:0 0 auto;width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;padding:0;cursor:pointer}
.bub .ci{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--c1)}
.bub[aria-pressed="true"] .ci{box-shadow:0 0 0 2px var(--paper),0 0 0 4.5px var(--ink)}
.bub .n{position:absolute;right:-3px;top:-3px;min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:var(--paper);font:600 11px/20px var(--f-mono);text-align:center;padding:0 5px}
.bub .lb{font-size:11px;line-height:1.2;color:var(--ink-2);text-align:center;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub.off{opacity:.35}
.bub.off .ci{box-shadow:none;filter:grayscale(.7)}

.layout{display:grid;gap:28px;padding-block:18px 48px}
.side{display:none}
@media (min-width:960px){
  .layout{grid-template-columns:220px minmax(0,1fr)}
  .side{display:block;position:sticky;top:150px;align-self:start;max-height:calc(100vh - 170px);overflow:auto}
}
.side button{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:8px;font-size:13.5px;cursor:pointer;color:var(--ink-2)}
.side button:hover{background:var(--bar-bg)}
.side button[aria-pressed="true"]{background:var(--amber-tint);color:var(--ink);font-weight:600}
.side .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:linear-gradient(150deg,var(--c1),var(--c2))}
.side .n{font:12px var(--f-mono);color:var(--muted)}
.side button.off{opacity:.4}

.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.kicker{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.kicker .sw{width:10px;height:10px;border-radius:50%;background:var(--amber)}

/* ---------- Tarjetas ---------- */
.tile{position:relative;display:block;width:100%;border:0;padding:0;text-align:left;cursor:pointer;border-radius:14px;overflow:hidden;color:#fff;background:linear-gradient(150deg,var(--c1),var(--c2));isolation:isolate}
.tile .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.tile::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72) 100%)}
.tile .glyph{position:absolute;z-index:-1;right:-6%;top:-4%;font-size:min(46vw,190px);line-height:1;opacity:.28;filter:saturate(.6);transform:rotate(-12deg);pointer-events:none}
.tile .pattern{position:absolute;inset:0;z-index:-1;opacity:.16;background-image:radial-gradient(#fff 1.2px,transparent 1.3px);background-size:14px 14px}
.tile.has-ph .glyph,.tile.has-ph .pattern{display:none}
.tile .body{position:absolute;left:0;right:0;bottom:0;padding:14px}
.tile .cat{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);border-radius:99px;padding:3px 9px 3px 6px;margin-bottom:8px}
.tile .ttl{font:650 16px/1.25 var(--f-display);text-wrap:pretty;text-shadow:0 1px 8px rgba(0,0,0,.25);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tile .foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11.5px;opacity:.92}
.tile .gauge{position:absolute;top:10px;right:10px}

.hero{aspect-ratio:4/5;max-height:560px}
@media (min-width:640px){.hero{aspect-ratio:16/9}}
.hero .ttl{font-size:clamp(23px,4.4vw,36px);-webkit-line-clamp:5}
.hero .body{padding:20px}
.hero .glyph{font-size:min(80vw,320px)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.grid .tile{aspect-ratio:3/4}
.grid .tile.wide{grid-column:span 2;aspect-ratio:auto;min-height:220px}
.grid .tile.wide .ttl{font-size:19px}

/* Medidor de importancia */
.gauge{width:42px;height:42px;display:block}
.gauge .tr{fill:rgba(0,0,0,.35);stroke:rgba(255,255,255,.25)}
.gauge .vl{fill:none;stroke:#fff;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.gauge text{fill:#fff;font:600 13px var(--f-mono);text-anchor:middle;dominant-baseline:central}

/* Fuentes como monogramas */
.mono{display:inline-flex}
.mono b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:600 8.5px var(--f-mono);color:#fff;background:var(--m);box-shadow:0 0 0 1.5px rgba(255,255,255,.85);text-transform:uppercase}
.mono b+b{margin-left:-6px}

.empty{padding:28px 0;color:var(--muted)}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--hair);padding-top:12px}

/* ---------- Ficha ---------- */
.sheet{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:760px){.sheet{align-items:center;padding:24px}}
.sheet .box{background:var(--panel);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.sheet .box{border-radius:18px}}
.sheet .tile{border-radius:0;aspect-ratio:16/9;cursor:default}
.sheet .in{padding:18px;display:grid;gap:16px}
.score{display:flex;gap:16px;align-items:center}
.score .big{width:84px;height:84px;flex:none}
.score .big .tr{fill:none;stroke:var(--bar-bg)}
.score .big .vl{fill:none;stroke:var(--amber);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.score .big text{fill:var(--ink);font:600 24px var(--f-mono);text-anchor:middle;dominant-baseline:central}
.score .lab{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.score .rk{font:650 20px/1.2 var(--f-display);margin:2px 0 8px}
.sum{margin:-4px 0 0;font:400 15.5px/1.55 var(--f-display);color:var(--ink-2);text-wrap:pretty;border-left:3px solid var(--c1);padding-left:12px}
.facts{display:flex;gap:6px;flex-wrap:wrap}
.facts span{display:inline-flex;align-items:center;gap:5px;background:var(--bar-bg);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--ink-2)}
.arts{display:flex;flex-direction:column;gap:8px}
.arts a{display:flex;align-items:center;gap:10px;text-decoration:none;border:1px solid var(--hair);border-radius:10px;padding:9px 12px;font-size:14px}
.arts a:hover{border-color:var(--amber)}
.arts .mono b{width:28px;height:28px;font-size:10px;box-shadow:none}
.arts em{margin-left:auto;font-style:normal;color:var(--muted);font-size:12px}
.close{justify-self:stretch;border:1px solid var(--hair);background:none;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:500}
@media (prefers-reduced-motion:no-preference){.tile .ph{transition:transform .5s ease}.tile:hover .ph{transform:scale(1.04)}.gauge .vl,.score .vl{transition:stroke-dasharray .6s ease}}

.status{font-size:11.5px;color:var(--muted);padding-bottom:6px;margin-top:-4px}
.brand{cursor:pointer}
/* Deslizar para actualizar: el radar baja con el dedo; al soltar solo gira el haz, despacio, y desaparece */
#ptr{--y:calc(-1 * (env(safe-area-inset-top,0px) + 64px));position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:30;width:40px;height:40px;margin-left:-20px;transform:translateY(var(--y));pointer-events:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
#ptr svg{display:block;width:100%;height:100%}
#ptr .ring{fill:#17232d;stroke:rgba(240,182,79,.35);stroke-width:1.5;transition:stroke .2s}
#ptr .arm{transform-origin:32px 32px;transform:rotate(var(--r,0deg))}
#ptr.ready .ring{stroke:#f0b64f;stroke-width:3}
#ptr.anim{transition:transform .28s cubic-bezier(.2,.9,.3,1.1),opacity .25s ease}
#ptr.busy{--y:6px}
#ptr.busy .arm{animation:arm 1.4s linear infinite}
#ptr.out{opacity:0;transform:translateY(6px) scale(.5)}
@keyframes arm{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.arts .more{margin:2px 2px 0;font-size:12.5px;color:var(--muted)}

/* ---------- Actualizar ahora ---------- */
.rf{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--hair);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.rf svg{width:18px;height:18px}
.rf:hover{color:var(--ink);border-color:var(--amber)}
.rf.busy{color:var(--amber);border-color:var(--amber)}
.rf.busy svg{animation:spin 1.4s linear infinite}
.status{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:18px}
.status .live{display:inline-flex;align-items:center;gap:6px;color:var(--amber);font-weight:600}
.status .live svg{width:15px;height:15px}
.status .live .sweep{transform-origin:32px 32px;animation:spin 1.4s linear infinite}
@media (max-width:420px){.bar{gap:6px}.brand{font-size:23px;gap:6px}.brand .logo{width:28px;height:28px}.seg button{padding:5px 7px}.rf,.gear{width:32px;height:32px}}

/* ---------- Desglose del índice en la ficha ---------- */
.bd{display:grid;gap:10px;border:1px solid var(--hair);border-radius:14px;padding:12px 12px 10px}
.bd .row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:3px 10px;align-items:center}
.lt{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 13px var(--f-mono);color:#fff;background:var(--k)}
.bd .nm{font-size:13.5px;font-weight:600;min-width:0}
.bd .nm small{font-weight:400;color:var(--muted);margin-left:6px}
.bd .pt{font:600 13.5px var(--f-mono);text-align:right;white-space:nowrap}
.bd .pt small{font:500 11px var(--f-mono);color:var(--muted)}
.bd .mt{grid-column:2/4;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.bd .mt span{height:6px;border-radius:3px;background:var(--bar-bg);overflow:hidden}
.bd .mt span i{display:block;height:100%;background:var(--k);border-radius:3px}
.bd .mt code{font:11px var(--f-mono);color:var(--muted)}
.bd .tot{border-top:1px dashed var(--hair);padding-top:8px;display:flex;gap:8px;align-items:baseline;font:12px var(--f-mono);color:var(--muted);flex-wrap:wrap}
.bd .tot b{margin-left:auto;font:700 17px var(--f-mono);color:var(--ink)}
.how{justify-self:start;background:none;border:0;padding:0;color:var(--amber);font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- Pantalla de la fórmula ---------- */
.ix .box{max-width:620px}
.ix .eqn{font:600 clamp(15px,4.2vw,20px)/1.7 var(--f-mono);text-align:center;padding:14px 10px;background:var(--paper);border:1px solid var(--hair);border-radius:14px}
.ix .eqn .t{white-space:nowrap}
.ix .eqn .t b{color:var(--k)}
.ix .eqn .t i{font-style:normal;color:#fff;background:var(--k);border-radius:5px;padding:0 5px;margin-left:2px}
.ix .stack{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px}
.ix .stack i{background:var(--k);transition:flex-grow .2s}
.ix .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.ix .legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--k);margin-right:5px}
.fx{display:grid;grid-template-columns:40px minmax(0,1fr);gap:2px 12px;padding:14px 0 10px;border-top:1px solid var(--hair)}
.fx .lt{width:40px;height:40px;border-radius:12px;font-size:19px;grid-row:span 4}
.fx h4{margin:0;font:650 16px/1.2 var(--f-display);display:flex;align-items:baseline;gap:8px}
.fx h4 span{margin-left:auto;font:700 15px var(--f-mono);color:var(--k)}
.fx code{font:12px/1.5 var(--f-mono);background:var(--bar-bg);padding:5px 8px;border-radius:7px;display:block;margin:4px 0}
.fx p{margin:2px 0 4px;font-size:13px;color:var(--ink-2)}
.fx input[type=range]{width:100%;accent-color:var(--k);margin:2px 0 0}
.prev{display:grid;gap:7px}
.prev .pr{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.prev .pr b{font:700 14px var(--f-mono)}
.prev .pr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev .pr em{font:600 11.5px var(--f-mono);font-style:normal;color:var(--muted)}
.prev .pr em.up{color:var(--hop)}.prev .pr em.dn{color:#c0392b}
.ix .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.arts a span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Ajustes ---------- */
.gear{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--hair);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.gear svg{width:18px;height:18px}
.gear:hover{color:var(--ink);border-color:var(--amber)}
.bar .seg{margin-left:auto}
@media (max-width:380px){.seg button{padding:5px 7px}}

.cfg .box{max-width:560px}
.cfg .hd{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:16px 18px 12px;background:var(--panel);border-bottom:1px solid var(--hair)}
.cfg .hd h2{font:750 22px/1 var(--f-display);margin:0;letter-spacing:-.01em}
.cfg .x{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--hair);background:none;cursor:pointer;font-size:16px;line-height:1}
.cfg section{padding:16px 18px;display:grid;gap:12px}
.cfg section+section{border-top:1px solid var(--hair)}
.cfg h3{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.cfg h3 .pill{margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:none;background:var(--bar-bg);color:var(--ink-2)}
.pill.ok{background:color-mix(in srgb,var(--hop) 18%,transparent);color:var(--hop)}
.pill.warn{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}

.tlist{display:grid;gap:6px}
.trow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 6px 6px 4px;border-radius:12px}
.trow:hover{background:var(--bar-bg)}
.trow .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:linear-gradient(150deg,var(--c1),var(--c2))}
.trow .nm{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .sub{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.trow .del{width:34px;height:34px;border-radius:50%;border:0;background:none;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.trow .del:hover{background:color-mix(in srgb,#c0392b 14%,transparent);color:#c0392b}
.trow .del svg{width:17px;height:17px}
.trow.pend .dot{animation:pulse 1.4s ease-in-out infinite}
.trow.ask{background:color-mix(in srgb,#c0392b 9%,transparent)}
.ask-row{display:flex;gap:6px}
.ask-row button{border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;border:1px solid var(--hair);background:var(--panel)}
.ask-row .yes{background:#c0392b;border-color:#c0392b;color:#fff;font-weight:600}
@keyframes pulse{50%{transform:scale(.88);opacity:.6}}

.addf{display:flex;gap:8px}
.addf input,.cfg input[type=text],.cfg input[type=password],.cfg input[type=url]{flex:1;min-width:0;background:var(--paper);border:1px solid var(--hair);border-radius:10px;padding:10px 12px;font-size:15px}
.cfg input:focus{outline:2px solid var(--amber);outline-offset:0;border-color:transparent}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer;background:var(--ink);color:var(--paper);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.amber{background:var(--amber);color:#fff}
.btn.ghost{background:none;color:var(--ink-2);border:1px solid var(--hair)}
.btn:disabled{opacity:.45;cursor:default}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.err{font-size:13px;color:#c0392b;margin:0}

.searching{display:grid;justify-items:center;gap:10px;padding:18px 0 8px;text-align:center}
.searching svg{width:64px;height:64px}
.searching .sweep{transform-origin:32px 32px;animation:spin 1.6s linear infinite}
.searching b{font:650 16px var(--f-display)}
.searching .steps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.searching .steps span{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--bar-bg);color:var(--muted)}
.searching .steps span.on{background:var(--amber-tint);color:var(--amber);font-weight:600}

.prop{display:grid;gap:12px;border:1px solid var(--hair);border-radius:14px;padding:12px;background:var(--paper)}
.prop .phead{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center}
.prop .big{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:linear-gradient(150deg,#5cc2b5,#1c6b62)}
.prop .names{display:grid;gap:6px;min-width:0}
.prop .names input{width:100%}
.prop .names input{padding:7px 10px;font-size:14px}
.prop .names .row2{display:flex;gap:6px}
.prop .names .row2 input:first-child{max-width:64px;text-align:center}
.srcl{display:grid;gap:4px;max-height:280px;overflow:auto;padding-right:2px}
.src{display:grid;grid-template-columns:22px 26px minmax(0,1fr);gap:8px;align-items:center;padding:6px;border-radius:9px;cursor:pointer}
.src:hover{background:var(--bar-bg)}
.src input{width:18px;height:18px;accent-color:var(--amber);margin:0}
.src .mono b{width:26px;height:26px;font-size:9.5px;box-shadow:none}
.src .t{min-width:0}
.src .t div{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .t small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src.bad .t div{color:var(--muted)}
.qchips{display:flex;flex-wrap:wrap;gap:5px}
.qchips span{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--bar-bg);color:var(--ink-2)}
.qchips span i{font-style:normal;color:var(--muted);font-family:var(--f-mono);font-size:10px;margin-left:4px}
.prop .acts{display:flex;gap:8px;justify-content:flex-end}

.cfg details summary{cursor:pointer;list-style:none}
.cfg details summary::-webkit-details-marker{display:none}
.cfg details[open] summary{margin-bottom:12px}
.conn{display:grid;gap:8px}
.conn label{font-size:12px;color:var(--ink-2);font-weight:500}

.bub.pend .ci{animation:pulse 1.4s ease-in-out infinite}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
</style>
</head>

  <defs>
    <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f0b64f" stop-opacity="0"></stop><stop offset="1" stop-color="#f0b64f" stop-opacity=".75"></stop></linearGradient>

    <circle class="grid" cx="32" cy="32" r="21"></circle><circle class="grid" cx="32" cy="32" r="11"></circle>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <circle class="bg" cx="32" cy="32" r="31"></circle><circle class="grid" cx="32" cy="32" r="21"></circle><circle class="grid" cx="32" cy="32" r="11"></circle>
        <g class="sweep"><path d="M32 32 L32 4 A28 28 0 0 1 56.2 18 Z" fill="url(#sw)"></path><line x1="32" y1="32" x2="56.2" y2="18" stroke="#f0b64f" stroke-width="2" stroke-linecap="round"></line></g>
        <circle class="blip" cx="45" cy="23" r="5.5"></circle><circle class="blip" cx="21" cy="40" r="3.8"></circle><circle class="blip" cx="39" cy="45" r="2.6"></circle></svg><span>Now<i>.</i></span></div>
      <div class="seg" id="period" aria-label="Periodo">

<script>
// ─── Now · app de noticias del News Digest ──────────────────────────────────
// Lee data/latest.json (7 días) al abrir; data/archive.json (30 días) solo si
// se elige un periodo más largo. El service worker guarda la última versión
// para poder leer sin conexión.

const PAL = [["#e7b45f","#7c4d12"],["#6ba3d0","#274d6e"],["#a882d8","#563a86"],["#7fb277","#2f5a2c"],["#5cc2b5","#1c6b62"],["#e0a05a","#8a4a15"],["#8f8be6","#2d2b8a"],["#d07a5f","#7a2415"],["#5fc6bc","#0d5b53"],["#bd8ae8","#5a1f8f"],["#66b6e0","#0a5a86"],["#e8a06a","#8a3a12"],["#e0ad63","#7a3a08"],["#aebf5f","#3f4a08"],["#8b87e0","#2b2585"],["#5cbfb4","#0c534d"],["#e089b0","#7a1240"],["#d0905f","#6a2a15"]];
const SHORT = { "industria-cervecera":"Cerveza", "pet-envases-plasticos":"PET", "materias-primas-de-envase":"Envases", "materias-primas-cerveceras":"Malta",
  "logistica-y-cadena-de-suministro":"Logística", "buenas-noticias":"Buenas", "noticias-internacionales":"Mundo", "noticias-espana":"España",
  "noticias-cuba":"Cuba", "buenas-practicas-de-manufactura-gmp":"GMP", "envasado-de-bebidas":"Envasado", "produccion-de-alimentos-y-fmcg":"FMCG",
  "seguridad-y-salud-en-el-trabajo":"SST", "lean-six-sigma-y-mejora-continua":"Lean", "mantenimiento-industrial-y-tpm":"Mantenim.",
  "sostenibilidad-y-packaging-sostenible":"Sostenib.", "noticias-mexico":"México", "marketing-y-branding":"Marketing" };
const MONO = ["#2f6fb0","#8a4fc4","#1f9e8f","#3c6f38","#c2410c","#a5670f","#be185d","#4338ca"];
const H = 3600e3, D = 24*H;

let DATA = null, ARCHIVE = null, CATS = [], CAT = {}, AUTH_RE = [], ROWS = [];
const RF = { on: false, t0: 0, base: 0, timer: null, tick: 0 };   // «Buscar noticias ahora» en curso
let PREVIEW_W = null;                   // pesos en edición en la pantalla de la fórmula
let PENDING_HASH = location.hash;       // #s=<id>: llega al tocar una notificación
const S = { period: "7", cat: "all", from: null, to: null };
try { const s = JSON.parse(localStorage.getItem("now") || "{}"); if (s.period) S.period = s.period; if (s.cat) S.cat = s.cat; } catch(e) {}
const save = () => { try { localStorage.setItem("now", JSON.stringify({ period: S.period, cat: S.cat })); } catch(e) {} };

const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const iso = ms => { const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const fmtDay = ms => new Date(ms).toLocaleDateString("es-ES", { day: "numeric", month: "short" });
const ago = ms => { const m = (Date.now() - ms)/60000; return m < 60 ? `${Math.max(1, Math.round(m))} min` : m < 1440 ? `${Math.round(m/60)} h` : `${Math.round(m/1440)} d`; };
const hash = s => [...s].reduce((a, c) => (a*31 + c.charCodeAt(0)) >>> 0, 7);
const initials = n => { const w = n.replace(/^(the|el|la|los|las)\s+/i, "").split(/[\s.\-]+/).filter(Boolean); return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || "?").slice(0, 2)).toUpperCase(); };
const mono = names => `<span class="mono">${names.slice(0, 4).map(n => `<b style="--m:${MONO[hash(n) % MONO.length]}" title="${esc(n)}">${esc(initials(n))}</b>`).join("")}</span>`;
const vars = c => `--c1:${c.c1};--c2:${c.c2}`;
const nrm = t => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
// Medio de referencia: coincidencia de palabra completa («dw» no casa con «hardware»)
const isAuth = src => { const n = nrm(src).replace(/ /g, ""); return AUTH_RE.some(r => r.test(n)); };
const fmt1 = n => n.toLocaleString("es-ES", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmt2 = n => n.toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function gauge(v, cls = "gauge", size = 42, stroke = 4) {
  const r = (size - stroke)/2 - 1, C = 2*Math.PI*r;
  return `<svg class="${cls}" viewBox="0 0 ${size} ${size}" aria-label="Importancia ${v} de 100"><circle class="tr" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"></circle><circle class="vl" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke-dasharray="${(C*v/100).toFixed(1)} ${C.toFixed(1)}"></circle><text x="50%" y="52%">${v}</text></svg>`;
}

// ─── Datos ──────────────────────────────────────────────────────────────────
async function getJSON(name) {
  const r = await fetch(`data/${name}?t=${Date.now()}`, { cache: "no-store" });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
function adoptCats() {
  const base = DATA ? DATA.categories : [];
  CATS = applyPending(base).map((c, i) => {
    const col = (Array.isArray(c.color) && c.color.length === 2) ? c.color : PAL[i % PAL.length];
    return { ...c, c1: col[0], c2: col[1], short: c.short || SHORT[c.id] || c.name.split(" ")[0], icon: c.icon || "📰" };
  });
  CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
}
function adopt(d) {
  AUTH_RE = (d.authority || []).map(a => new RegExp(`(^|[^a-z0-9])${reEsc(nrm(a).replace(/ /g, ""))}([^a-z0-9]|$)`));
  d.stories.forEach(s => {
    s.cs = s.cs && s.cs.length ? s.cs : [s.c];
    s.arts = s.a.map(([src, ts, url, c]) => ({ src, t: ts*1000, url, c: c || s.c })).sort((x, y) => x.t - y.t);
    s.link = (s.arts.find(a => a.url) || {}).url || "";
  });
  return d;
}
async function load(force) {
  setStatus("Actualizando…");
  try {
    DATA = adopt(await getJSON("latest.json"));
    adoptCats();
    if (force) ARCHIVE = null;
    if (needsArchive()) ARCHIVE = adopt(await getJSON("archive.json"));
    render(); setStatus();
    if (PENDING_HASH) { const h = PENDING_HASH; PENDING_HASH = ""; openFromHash(h); }
  } catch (e) {
    if (DATA) { setStatus(); return; }
    $("#main").innerHTML = `<p class="empty">No se pudieron cargar las noticias. Revisa la conexión y desliza hacia abajo para reintentar.</p>`;
    $("#status").textContent = "Sin conexión";
  }
}
const needsArchive = () => S.period === "30" || (S.period === "custom" && S.from && Date.parse(S.from) < Date.now() - 7*D);
function setStatus(msg) {
  const el = $("#status");
  if (RF.on) return paintRefresh();
  if (msg) { el.textContent = msg; return; }
  if (!DATA) return;
  el.textContent = `${navigator.onLine === false ? "Sin conexión · " : ""}Actualizado hace ${ago(DATA.updated*1000)}`;
}

// ─── Periodo e índice de importancia ────────────────────────────────────────
function windowMs() {
  const now = Date.now();
  if (S.period === "custom" && S.from && S.to) return [new Date(S.from + "T00:00:00").getTime(), new Date(S.to + "T23:59:59").getTime()];
  return [now - (S.period === "custom" ? 7 : +S.period)*D, now];
}
function periodLabel() {
  const [a, b] = windowMs();
  if (S.period === "1") return "Últimas 24 horas";
  if (S.period === "custom") return `${fmtDay(a)} – ${fmtDay(b)}`;
  return `Últimos ${S.period} días`;
}
// ─── Índice de importancia v2 ───────────────────────────────────────────────
// Índice = 100 × (wC·C + wI·I + wA·A + wD·D + wR·R + wP·P), con pesos que suman 1.
// Mismo cálculo en build.py (avisos) y en el conector de Claude.
const DEF_IX = { weights: { cobertura: .40, impulso: .20, alcance: .15, duracion: .10, recencia: .10, preferencias: .05 }, ref_outlets: 20, ref_recent: 10, recent_hours: 12 };
const FX = [
  { k: "cobertura", L: "C", name: "Cobertura", col: "#2f6fb0", f: "ln(1 + medios + 0,5·referencia) ÷ ln(1 + 20)",
    what: "Cuántos medios distintos publican la noticia. Escala logarítmica: pasar de 1 a 5 medios suma mucho; de 15 a 20, poco. Agencias y prensa de referencia cuentan 1,5. Con 20 o más, el máximo.",
    data: r => `${r.cov} ${r.cov === 1 ? "medio" : "medios"}${r.auth ? ` · ${r.auth} ref.` : ""}` },
  { k: "impulso", L: "I", name: "Impulso", col: "#c2410c", f: "ln(1 + medios en las últimas 12 h) ÷ ln(1 + 10)",
    what: "Cuántos medios se han sumado en las últimas 12 horas. Es lo que hace subir de golpe una noticia que está estallando.",
    data: r => `${r.recent} en 12 h` },
  { k: "alcance", L: "A", name: "Alcance", col: "#8a4fc4", f: "½·mín(1, (secciones − 1) ÷ 2) + ½·mín(1, referencia ÷ 2)",
    what: "Si la noticia salta de una sección a otras (de España a Mundo, por ejemplo) y si la cubren agencias o prensa de referencia.",
    data: r => `${r.secs} ${r.secs === 1 ? "sección" : "secciones"}` },
  { k: "duracion", L: "D", name: "Duración", col: "#1f9e8f", f: "mín(1, (días con medios nuevos − 1) ÷ 2)",
    what: "Las noticias de verdad importantes siguen sumando medios varios días seguidos. Con 3 días, el máximo.",
    data: r => `${r.days} ${r.days === 1 ? "día" : "días"}` },
  { k: "recencia", L: "R", name: "Recencia", col: "#a5670f", f: "0,5 ^ (horas desde la última mención ÷ vida media)",
    what: "Pierde la mitad de su valor cada «vida media»: 12 h en «Hoy», 24 h en 7 días y 72 h en 30 días.",
    data: r => `hace ${ago(r.last)}` },
  { k: "preferencias", L: "P", name: "Preferencias", col: "#be185d", f: "mín(1, palabras de tus intereses ÷ 2)",
    what: "Sube un poco lo que contiene tus palabras clave (cerveza, PET, Krones…). Con poco peso, para que no tape lo importante.",
    data: r => r.s.aff ? `${r.s.aff} ${r.s.aff === 1 ? "coincidencia" : "coincidencias"}` : "ninguna" },
];
const normW = w => { const t = FX.reduce((a, x) => a + Math.max(0, +w[x.k] || 0), 0) || 1; return Object.fromEntries(FX.map(x => [x.k, Math.max(0, +w[x.k] || 0)/t])); };
function savedWeights() {
  const srv = (DATA && DATA.index && DATA.index.weights) || DEF_IX.weights, loc = LS("now_weights");
  if (!loc) return srv;
  const same = FX.every(x => Math.abs((normW(loc.w)[x.k]) - (normW(srv)[x.k])) < 0.005);
  if (loc.scope === "global" && (same || Date.now() - loc.at > 6*H)) { LS("now_weights", null); return srv; }
  return loc.w;
}
function IX(override) { const base = { ...DEF_IX, ...((DATA && DATA.index) || {}) }; return { ...base, weights: normW(override || PREVIEW_W || savedWeights()) }; }

function factorsOf(s, a, b, now, ix) {
  const m = s.arts.filter(x => x.t >= a && x.t <= b);
  if (!m.length) return null;
  const names = [...new Set(m.map(x => x.src))], auth = names.filter(isAuth).length;
  const ref = Math.min(now, b), first = m[0].t, last = m[m.length - 1].t;
  const recent = new Set(m.filter(x => x.t >= ref - ix.recent_hours*H).map(x => x.src)).size;
  const secs = new Set(m.map(x => x.c)).size, days = new Set(m.map(x => Math.floor(x.t/D))).size;
  const half = Math.min(72*H, Math.max(12*H, (b - a)/7));
  const f = {
    cobertura: Math.min(1, Math.log(1 + names.length + 0.5*auth)/Math.log(1 + ix.ref_outlets)),
    impulso: Math.min(1, Math.log(1 + recent)/Math.log(1 + ix.ref_recent)),
    alcance: 0.5*Math.min(1, (secs - 1)/2) + 0.5*Math.min(1, auth/2),
    duracion: Math.min(1, (days - 1)/2),
    recencia: Math.pow(0.5, Math.max(0, ref - last)/half),
    preferencias: Math.min(1, (s.aff || 0)/2),
  };
  const idx = Math.round(100*FX.reduce((t, x) => t + ix.weights[x.k]*f[x.k], 0));
  return { s, m, names, cov: names.length, auth, recent, secs, days, first, last, half, f, idx };
}

}

// un poco según tiras); al soltar se queda quieto arriba con el haz barriendo
// despacio hasta que la petición sale, y desaparece. El progreso sigue arriba.
(() => {
  const ptr = $("#ptr"), arm = ptr.querySelector(".arm"), PULL = 90;
  let y0 = null, dy = 0;
  const reset = () => { ptr.classList.remove("ready", "busy", "out", "anim"); ptr.style.removeProperty("--y"); arm.style.removeProperty("--r"); };
  const idle = () => scrollY <= 0 && $("#sheet").hidden && $("#settings").hidden && $("#ixSheet").hidden;
  addEventListener("touchstart", e => { y0 = idle() && !ptr.classList.contains("busy") ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  addEventListener("touchmove", e => {
    if (y0 === null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    const pull = Math.min(dy*0.55, 96);
    ptr.classList.remove("anim");
    ptr.style.setProperty("--y", `calc(-1 * (env(safe-area-inset-top, 0px) + 64px) + ${pull}px)`);
    arm.style.setProperty("--r", `${Math.min(dy, 220)*1.2}deg`);
    ptr.classList.toggle("ready", dy > PULL);
  }, { passive: true });
  addEventListener("touchend", async () => {
    if (y0 === null) return;
    y0 = null;
    ptr.classList.add("anim");
    if (dy <= PULL) { ptr.classList.remove("ready"); ptr.style.removeProperty("--y"); arm.style.removeProperty("--r"); setTimeout(reset, 300); return; }
    ptr.style.removeProperty("--y"); arm.style.removeProperty("--r");
    ptr.classList.add("busy");
    const t0 = Date.now();
    await refreshNow().catch(() => {});
    await new Promise(r => setTimeout(r, Math.max(0, 700 - (Date.now() - t0))));
    ptr.classList.add("out");
    setTimeout(reset, 320);
  });
})();

// ─── Ajustes: temas con IA ──────────────────────────────────────────────────
// La lista de temas vive en topics.json (en GitHub). La función «now» de
// Supabase la cambia y GitHub Actions reconstruye las noticias en unos minutos.
// Mientras tanto, los cambios se muestran en la app como «pendientes».

const LS = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); } catch(e) { return null; } };
let PEND = LS("now_pending") || { adds: [], dels: [] };
const savePend = () => LS("now_pending", PEND);
const conn = () => { const c = LS("now_conn") || {}; return { url: (c.url || DATA?.api_url || "").trim(), key: (c.key || "").trim() }; };
const apiBase = u => u.replace(/\/+$/, "").replace(/\/(topics|mcp)$/, "");

// Aplica los cambios pendientes sobre las categorías publicadas
function applyPending(cats) {
  const now = Date.now(), ids = new Set(cats.map(c => c.id));
  PEND.adds = PEND.adds.filter(a => !ids.has(a.id) && now - a.at < 3*H);
  PEND.dels = PEND.dels.filter(d => ids.has(d.id) && now - d.at < 3*H);
  savePend();
  const gone = new Set(PEND.dels.map(d => d.id));
  return [...cats.filter(c => !gone.has(c.id)), ...PEND.adds.map(a => ({ ...a, pending: true }))];
}

async function api(action, payload = {}, ms = 160000) {
  const { url, key } = conn();
  if (!url || !key) throw new Error("Configura primero la conexión (más abajo).");
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(apiBase(url) + "/topics", { method: "POST", signal: ctl.signal,
      headers: { "content-type": "application/json", "x-now-key": key }, body: JSON.stringify({ action, ...payload }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.error) throw new Error(d.error || `Error ${r.status}`);
    return d;
  } catch (e) {
    throw new Error(e.name === "AbortError" ? "La búsqueda tardó demasiado. Vuelve a intentarlo." : (e.message === "Failed to fetch" ? "No se pudo contactar con la función. Revisa la URL y tu conexión." : e.message));
  } finally { clearTimeout(tm); }
}

function toast(msg) {
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

const ICON_GEAR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;
const ICON_TRASH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>`;
const RADAR = `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#17232d"></circle><circle cx="32" cy="32" r="21" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.2"></circle><circle cx="32" cy="32" r="11" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.2"></circle><g class="sweep"><path d="M32 32 L32 4 A28 28 0 0 1 56.2 18 Z" fill="url(#sw)"></path><line x1="32" y1="32" x2="56.2" y2="18" stroke="#f0b64f" stroke-width="2" stroke-linecap="round"></line></g><circle cx="45" cy="23" r="5" fill="#f0b64f"></circle><circle cx="21" cy="40" r="3.4" fill="#f0b64f"></circle></svg>`;

const PUSH = { active: false, perm: "default", busy: false, msg: "", err: "" };
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const needsInstall = () => /iphone|ipad|ipod/i.test(navigator.userAgent) && !(navigator.standalone || matchMedia("(display-mode: standalone)").matches);
const b64u = t => Uint8Array.from(atob(t.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(t.length/4)*4, "=")), c => c.charCodeAt(0));
const deviceName = () => /iphone/i.test(navigator.userAgent) ? "iPhone" : /ipad/i.test(navigator.userAgent) ? "iPad" : /android/i.test(navigator.userAgent) ? "Android" : "Ordenador";
async function refreshPush() {
  if (!pushSupported()) return;
  PUSH.perm = Notification.permission;
  try { const reg = await navigator.serviceWorker.ready; PUSH.active = !!(await reg.pushManager.getSubscription()) && PUSH.perm === "granted"; } catch (e) { PUSH.active = false; }
  renderSettings();
}
async function enablePush() {
  PUSH.busy = true; PUSH.err = ""; PUSH.msg = ""; renderSettings();
  try {
    const perm = await Notification.requestPermission();            // debe ir justo tras el toque
    PUSH.perm = perm;
    if (perm !== "granted") throw new Error("Permiso denegado. Actívalo en Ajustes del dispositivo → Notificaciones → Now.");
    const { publicKey } = await api("push_key", {}, 30000);
    const reg = await navigator.serviceWorker.ready;
    const old = await reg.pushManager.getSubscription(); if (old) await old.unsubscribe();
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(publicKey) });
    await api("push_subscribe", { subscription: sub.toJSON(), label: deviceName() }, 30000);
    PUSH.active = true; PUSH.msg = "Notificaciones activadas en este dispositivo.";
    reg.showNotification("Now", { body: `Listo. Te aviso cuando haya una noticia con importancia de ${THR()} o más.`, icon: "icon-192.png", tag: "now-on" });
  } catch (e) { PUSH.err = e.message; }
  finally { PUSH.busy = false; renderSettings(); }
}
async function disablePush() {
  PUSH.busy = true; PUSH.err = ""; PUSH.msg = ""; renderSettings();
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (sub) { const ep = sub.endpoint; await sub.unsubscribe(); try { await api("push_unsubscribe", { endpoint: ep }, 30000); } catch (e) {} }
    PUSH.active = false; PUSH.msg = "Notificaciones desactivadas en este dispositivo.";
  } catch (e) { PUSH.err = e.message; }
  finally { PUSH.busy = false; renderSettings(); }
}
const THR = () => (DATA && DATA.notify_threshold) || 75;
function notifSection(ready) {
  const sup = pushSupported(), ins = needsInstall();
  const pill = !sup ? `<span class="pill warn">No disponible</span>` : PUSH.active ? `<span class="pill ok">Activadas</span>` : `<span class="pill">Desactivadas</span>`;
  let body;
  if (!sup) body = `<p class="hint">${ins ? "En iPhone y iPad las notificaciones solo funcionan con Now instalada: pulsa Compartir → «Añadir a pantalla de inicio» y ábrela desde el icono." : "Este navegador no admite notificaciones push."}</p>`;
  else body = `<p class="hint">Te aviso cuando aparezca una noticia con un índice de importancia de <b>${THR()}</b> o más. Se comprueba en cada actualización (cada hora o cuando pulses ↻) y recibirás como máximo 3 avisos cada vez.</p>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${PUSH.active
      ? `<button class="btn ghost" data-cfg="push-off" ${PUSH.busy ? "disabled" : ""}>Desactivar en este dispositivo</button>`
      : `<button class="btn amber" data-cfg="push-on" ${PUSH.busy || !ready ? "disabled" : ""}>${PUSH.busy ? "Activando…" : "🔔 Activar notificaciones"}</button>`}</div>
    ${!ready && !PUSH.active ? `<p class="hint">Configura antes la conexión (más abajo): hace falta para registrar este dispositivo.</p>` : ""}
    ${PUSH.perm === "denied" ? `<p class="err">Las notificaciones están bloqueadas para Now en este dispositivo. Actívalas en los ajustes del sistema.</p>` : ""}
    ${PUSH.err ? `<p class="err">${esc(PUSH.err)}</p>` : PUSH.msg ? `<p class="hint">✅ ${esc(PUSH.msg)}</p>` : ""}`;
  return `<section><h3>🔔 Notificaciones ${pill}</h3>${body}</section>`;
}

const CFG = { open: false, ask: null, busy: false, step: 0, prop: null, error: "", connMsg: "", connOk: null };

function openSettings() { CFG.open = true; CFG.error = ""; PUSH.msg = PUSH.err = ""; renderSettings(); $("#settings").hidden = false; refreshPush(); }
function closeSettings() { if (CFG.busy) return; CFG.open = false; CFG.ask = null; $("#settings").hidden = true; }

function renderSettings() {
  if (!CFG.open) return;
  const c = conn(), ready = !!(c.url && c.key);
  const cats = CATS;
  const rows = cats.map(t => CFG.ask === t.id
    ? `<div class="trow ask" style="${vars(t)}"><span class="dot">${t.icon}</span><span class="nm">¿Borrar «${esc(t.name)}»?</span>
        <span class="ask-row"><button data-cfg="no">Cancelar</button><button class="yes" data-cfg="del-yes" data-id="${t.id}">Borrar</button></span></div>`
    : `<div class="trow${t.pending ? " pend" : ""}" style="${vars(t)}"><span class="dot">${t.icon}</span>
        <span style="min-width:0"><div class="nm">${esc(t.name)}</div><div class="sub">${t.pending ? "<span>⏳ Buscando sus primeras noticias…</span>" : `<span>📡 ${t.sources ?? "–"} fuentes</span><span>🔎 ${t.queries ?? "–"} búsquedas</span>`}</div></span>
        ${ready && !t.pending ? `<button class="del" data-cfg="del" data-id="${t.id}" aria-label="Borrar ${esc(t.name)}">${ICON_TRASH}</button>` : "<span></span>"}</div>`).join("");

  const steps = ["Buscando medios", "Localizando feeds RSS", "Comprobando que funcionan"];
  let add;
  if (CFG.busy && !CFG.prop) {
    add = `<div class="searching">${RADAR}<b>Buscando las mejores fuentes…</b>
      <div class="steps">${steps.map((s, i) => `<span class="${i <= CFG.step ? "on" : ""}">${s}</span>`).join("")}</div>
      <p class="hint">Claude busca en la web y comprueba cada feed. Suele tardar entre 30 segundos y 2 minutos.</p></div>`;
  } else if (CFG.prop) {
    const p = CFG.prop, okN = p.sources.filter(s => s.on).length;
    add = `<div class="prop">
      <div class="phead"><span class="big" style="background:linear-gradient(150deg,#e7b45f,#7c4d12)">${esc(p.icon)}</span>
        <div class="names"><input type="text" id="pName" value="${esc(p.name)}" aria-label="Nombre del tema" maxlength="60">
          <div class="row2"><input type="text" id="pIcon" value="${esc(p.icon)}" aria-label="Icono" maxlength="8"><input type="text" id="pShort" value="${esc(p.short)}" aria-label="Nombre corto en la barra" maxlength="12"></div></div></div>
      <h3>📡 Fuentes <span class="pill ${okN >= 10 ? "ok" : "warn"}">${okN} seleccionadas</span></h3>
      <div class="srcl">${p.sources.map((s, i) => `<label class="src${s.ok ? "" : " bad"}"><input type="checkbox" data-src="${i}" ${s.on ? "checked" : ""} ${s.ok ? "" : "disabled"}>${mono([s.name || "?"])}
        <span class="t"><div>${esc(s.name)}</div><small>${s.ok ? esc((s.feed || "").replace(/^https?:\/\//, "")) : "⚠️ " + esc(s.note || "No funciona")}</small></span></label>`).join("")}</div>
      ${p.queries.length ? `<h3>🔎 Búsquedas en Google News</h3><div class="qchips">${p.queries.map(q => `<span>${esc(q.q)}<i>${esc(q.lang)}</i></span>`).join("")}</div>` : ""}
      ${CFG.error ? `<p class="err">${esc(CFG.error)}</p>` : ""}
      <div class="acts"><button class="btn ghost" data-cfg="cancel" ${CFG.busy ? "disabled" : ""}>Descartar</button>
        <button class="btn amber" data-cfg="add" ${CFG.busy || (!okN && !p.queries.length) ? "disabled" : ""}>${CFG.busy ? "Añadiendo…" : "＋ Añadir a Now"}</button></div></div>`;
  } else {
    add = `<form class="addf" id="addForm"><input type="text" id="newTopic" placeholder="Ej.: Francia, energía solar, Fórmula 1" maxlength="80" ${ready ? "" : "disabled"} autocomplete="off">
      <button class="btn" ${ready ? "" : "disabled"}>✨ Buscar</button></form>
      ${CFG.error ? `<p class="err">${esc(CFG.error)}</p>` : `<p class="hint">${ready ? "Claude buscará entre 10 y 20 fuentes y las búsquedas de Google News para el tema. Podrás revisarlas antes de añadirlo." : "Para añadir o borrar temas, configura antes la conexión."}</p>`}`;
  }

  $("#cfgBox").innerHTML = `
    <div class="hd"><h2>Ajustes</h2><button class="x" data-cfg="close" aria-label="Cerrar">✕</button></div>
    <section><h3>✨ Añadir un tema</h3>${add}</section>
    <section><h3>Tus temas <span class="pill">${cats.length}</span></h3><div class="tlist">${rows}</div>
      <p class="hint">Los cambios se aplican en unos minutos y los ven todas las personas que usan esta instalación de Now.</p></section>
    <section><h3>📐 Índice de importancia</h3><p class="hint">Mira la ecuación completa, qué mide cada factor y ajusta sus pesos con una vista previa de la portada.</p>
      <div><button class="btn ghost" data-ix>Ver la fórmula y ajustar pesos</button></div></section>
    ${notifSection(ready)}
    <section><details ${ready ? "" : "open"}><summary><h3>🔌 Conexión <span class="pill ${ready ? (CFG.connOk === false ? "warn" : "ok") : "warn"}">${ready ? (CFG.connOk === false ? "Revisar" : "Configurada") : "Sin configurar"}</span></h3></summary>
      <form class="conn" id="connForm">
        <label for="cUrl">URL de la función</label><input type="url" id="cUrl" value="${esc(c.url)}" placeholder="https://xxxx.supabase.co/functions/v1/now" autocomplete="off">
        <label for="cKey">Clave de administración</label><input type="password" id="cKey" value="${esc(c.key)}" placeholder="La que pusiste en NOW_ADMIN_KEY" autocomplete="off">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn">Guardar y comprobar</button><span class="hint" id="connMsg">${esc(CFG.connMsg)}</span></div>
        <p class="hint">La clave solo se guarda en este dispositivo.</p>
      </form></details></section>`;
}

let stepTimer = null;
async function searchTopic(name) {
  CFG.busy = true; CFG.prop = null; CFG.error = ""; CFG.step = 0; renderSettings();
  stepTimer = setInterval(() => { CFG.step = Math.min(2, CFG.step + 1); renderSettings(); }, 14000);
  try {
    const { proposal } = await api("suggest", { name });
    proposal.sources.forEach(s => s.on = s.ok);
    CFG.prop = proposal;
  } catch (e) { CFG.error = e.message; }
  finally { clearInterval(stepTimer); CFG.busy = false; renderSettings(); }
}

async function addTopic() {
  const p = CFG.prop;
  p.name = $("#pName").value.trim() || p.name; p.icon = $("#pIcon").value.trim() || p.icon; p.short = $("#pShort").value.trim() || p.short;
  CFG.busy = true; CFG.error = ""; renderSettings();
  try {
    const d = await api("add", { topic: { name: p.name, short: p.short, icon: p.icon, feeds: p.sources.filter(s => s.on).map(s => s.feed), queries: p.queries } }, 30000);
    const t = d.topic;
    PEND.adds.push({ id: t.id, name: t.name, short: t.short, icon: t.icon, color: t.color, sources: t.sources, queries: t.queries, at: Date.now() });
    savePend();
    CFG.prop = null; CFG.busy = false;
    adoptCats(); render(); renderSettings(); watchPending();
    toast(`«${t.name}» añadido. Sus noticias llegarán en unos minutos.`);
  } catch (e) { CFG.busy = false; CFG.error = e.message; renderSettings(); }
}

async function deleteTopic(id) {
  const t = CATS.find(c => c.id === id); CFG.ask = null;
  CFG.busy = true; renderSettings();
  try {
    await api("delete", { id }, 30000);
    PEND.dels.push({ id, at: Date.now() }); savePend();
    if (S.cat === id) { S.cat = "all"; save(); }
    adoptCats(); render(); toast(`«${t ? t.name : id}» borrado.`); watchPending();
  } catch (e) { CFG.error = e.message; }
  finally { CFG.busy = false; renderSettings(); }
}

async function saveConn(url, key) {
  LS("now_conn", { url: url.trim(), key: key.trim() });
  CFG.connMsg = "Comprobando…"; renderSettings();
  try { const d = await api("check", {}, 20000); CFG.connOk = true; CFG.connMsg = d.ai ? "✅ Conectado" : "✅ Conectado · falta la clave de la IA en la función"; }
  catch (e) { CFG.connOk = false; CFG.connMsg = "❌ " + e.message; }
  renderSettings();
}

// Mientras haya cambios pendientes, consulta los datos cada minuto (hasta 20 min)
let watch = null;
function watchPending() {
  if (watch) return;
  let n = 0;
  watch = setInterval(async () => {
    n++;
    if ((!PEND.adds.length && !PEND.dels.length) || n > 20) { clearInterval(watch); watch = null; return; }
    await load(false); renderSettings();
  }, 60000);
}

document.addEventListener("click", e => {
  if (e.target.closest("#gear")) return openSettings();
  if (e.target.id === "settings") return closeSettings();
  const b = e.target.closest("[data-cfg]"); if (!b) return;
  const a = b.dataset.cfg;
  if (a === "close") closeSettings();
  else if (a === "del") { CFG.ask = b.dataset.id; renderSettings(); }
  else if (a === "no") { CFG.ask = null; renderSettings(); }
  else if (a === "del-yes") deleteTopic(b.dataset.id);
  else if (a === "cancel") { CFG.prop = null; CFG.error = ""; renderSettings(); }
  else if (a === "add") addTopic();
  else if (a === "push-on") enablePush();
  else if (a === "push-off") disablePush();
});
document.addEventListener("change", e => {
  const i = e.target.dataset?.src;
  if (i !== undefined && CFG.prop) {
    ["pName", "pIcon", "pShort"].forEach(id => { const el = $("#" + id); if (el) CFG.prop[{ pName: "name", pIcon: "icon", pShort: "short" }[id]] = el.value; });
    CFG.prop.sources[+i].on = e.target.checked; renderSettings();
  }
});
document.addEventListener("submit", e => {
  if (e.target.id === "addForm") { e.preventDefault(); const v = $("#newTopic").value.trim(); if (v.length >= 2) searchTopic(v); }
  if (e.target.id === "connForm") { e.preventDefault(); saveConn($("#cUrl").value, $("#cKey").value); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && CFG.open) closeSettings(); });
if (PEND.adds.length || PEND.dels.length) watchPending();

$("#gear").innerHTML = ICON_GEAR;
$("#rf").innerHTML = ICON_RF;
const splashDone = new Promise(res => setTimeout(res, 2040));
load(false);
splashDone.then(() => { const sp = document.getElementById("splash"); if (sp) sp.remove(); });
</script>
